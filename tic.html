<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Notification Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #121212; color: #fff; }
    header { padding: 20px; background: #1f1f1f; text-align: center; font-size: 24px; border-bottom: 1px solid #333; }
    .tabs { display: flex; justify-content: center; background: #1f1f1f; }
    .tabs button {
      background: transparent;
      border: none;
      color: #bbb;
      padding: 15px 25px;
      cursor: pointer;
      font-size: 16px;
    }
    .tabs button.active { color: #fff; border-bottom: 2px solid #4CAF50; }
    .notification-container { padding: 20px; max-width: 800px; margin: auto; }
    .notification-card {
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 12px;
      margin-bottom: 20px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: fadeIn 0.4s ease-in;
    }
    .notification-card .info {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .notification-card .info img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
    }
    .notification-card .info .text {
      line-height: 1.4;
    }
    .notification-card .badge {
      margin-left: 10px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
    }
    .urgent { background: #d32f2f; }
    .social { background: #4CAF50; }
    .location { background: #2196F3; }
    .actions button {
      background: #333;
      border: none;
      color: #fff;
      padding: 6px 12px;
      margin-left: 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .actions button:hover { background: #555; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<header>🌍 Global Notifications</header>
<div class="tabs">
  <button class="active" onclick="filterTab('all')">All</button>
  <button onclick="filterTab('unread')">Unread</button>
  <button onclick="filterTab('messages')">Messages</button>
  <button onclick="filterTab('trending')">Trending</button>
</div>

<div class="notification-container" id="notifications">
  <!-- Example Notification -->
  <div class="notification-card" data-type="social">
    <div class="info">
      <img src="https://i.pravatar.cc/50?img=1" alt="User">
      <div class="text">
        <strong>John</strong> liked your post in <em>Tokyo</em><br>
        <small>2 minutes ago</small>
        <span class="badge location">🌍 Tokyo</span>
        <span class="badge social">💬 Like</span>
      </div>
    </div>
    <div class="actions">
      <button onclick="alert('Replied')">Reply</button>
      <button onclick="this.parentElement.parentElement.remove()">Dismiss</button>
    </div>
  </div>
  <div class="notification-card" data-type="trending">
    <div class="info">
      <img src="https://i.pravatar.cc/50?img=8" alt="User">
      <div class="text">
        <strong>Trending:</strong> #EarthDay is viral in New York<br>
        <small>10 minutes ago</small>
        <span class="badge location">🌍 New York</span>
        <span class="badge urgent">🔴 Trending</span>
      </div>
    </div>
    <div class="actions">
      <button onclick="alert('Viewed')">View</button>
      <button onclick="this.parentElement.parentElement.remove()">Dismiss</button>
    </div>
  </div>
</div>

<script>
  function filterTab(type) {
    document.querySelectorAll(".tabs button").forEach(btn => btn.classList.remove("active"));
    event.target.classList.add("active");

    const cards = document.querySelectorAll('.notification-card');
    cards.forEach(card => {
      if (type === 'all') {
        card.style.display = 'flex';
      } else {
        const match = card.getAttribute('data-type') === type;
        card.style.display = match ? 'flex' : 'none';
      }
    });
  }
</script>

</body>
</html>
