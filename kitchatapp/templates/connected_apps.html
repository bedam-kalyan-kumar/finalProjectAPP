<!-- kitchatapp/templates/connected_apps.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connected Apps</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        ul {
            list-style: none;
            padding: 0;
            max-width: 600px;
            margin: auto;
        }
        li {
            background: #fff;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        li:hover {
            background: #e9f5ff;
        }
        i {
            font-size: 24px;
            margin-right: 15px;
            color: #333;
        }
        .app-name {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Connected Apps</h1>
    <ul>
        <li><i class="fab fa-instagram" style="color:#E1306C;"></i> <span class="app-name">Instagram</span></li>
        <li><i class="fab fa-facebook" style="color:#4267B2;"></i> <span class="app-name">Facebook</span></li>
        <li><i class="fab fa-whatsapp" style="color:#25D366;"></i> <span class="app-name">WhatsApp</span></li>
        <li><i class="fab fa-twitter" style="color:#1DA1F2;"></i> <span class="app-name">Twitter</span></li>
        <li><i class="fab fa-snapchat-ghost" style="color:#FFFC00;"></i> <span class="app-name">Snapchat</span></li>
        <li><i class="fab fa-telegram" style="color:#0088cc;"></i> <span class="app-name">Telegram</span></li>
        <li><i class="fab fa-linkedin" style="color:#0077b5;"></i> <span class="app-name">LinkedIn</span></li>
    </ul>
</body>
</html>
