<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <i class="fas fa-arrow-left" onclick="window.history.back()" title="Back"></i>
            <h2>Edit Profile</h2>
        </div>

        <form method="POST" enctype="multipart/form-data" class="edit-profile-form">
            {% csrf_token %}
            
            <!-- Profile Picture Update -->
            <div class="profile-photo-section">
                <label for="profile_picture">
                    <img src="{{ user.profile_picture.url|default:'/static/default-avatar.png' }}" alt="Profile Picture" class="profile-photo">
                    <div class="camera-icon"><i class="fas fa-camera"></i></div>
                </label>
                <input type="file" id="profile_picture" name="profile_picture" accept="image/*" style="display: none;">
            </div>

            <!-- Username -->
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ user.username }}" required>

            <!-- Bio -->
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="3">{{ user.bio }}</textarea>

            <!-- Email -->
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" required>

            <!-- Submit Button -->
            <button type="submit" class="save-btn">Save Changes</button>
        </form>
    </div>

    <script>
        document.getElementById('profile_picture').addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.querySelector('.profile-photo').src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
