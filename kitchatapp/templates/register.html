<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register & Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card w-100" style="max-width: 450px;">
        <div class="card-body">
            <h3 class="text-center mb-4">Register</h3>

            {% if not email %}
            <!-- Registration Form -->
            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="step" value="register">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required minlength="4">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required minlength="6">
                </div>
                <div class="mb-3">
                    <label for="gmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="gmail" name="gmail" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            {% else %}
            <!-- OTP Verification Form -->
            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="step" value="verify">
                <input type="hidden" name="email" value="{{ email }}">
                <div class="mb-3">
                    <label for="otp" class="form-label">Enter OTP sent to {{ email }}</label>
                    <input type="text" class="form-control" id="otp" name="otp" required maxlength="6" placeholder="6-digit OTP">
                </div>
                <button type="submit" class="btn btn-success w-100">Verify OTP</button>
            </form>
            {% endif %}

            {% if error %}
                <div class="alert alert-danger mt-3">{{ error }}</div>
            {% endif %}

            <div class="text-center mt-3">
                Already have an account? <a href="{% url 'loginform' %}">Login</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
