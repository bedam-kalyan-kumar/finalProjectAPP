<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Settings Page</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      border: 0px 0px 2px 2px;
      border-color: black;
      /* background-color: #f8f9fa; */
      margin-left: 360px;
      margin-right: 350px;
      /* border: 2px solid black; */
      height: 665px;
    }

    .mode-toggle {
      /* position: fixed;
            top: 20px;
            right: 370px; */
      background: linear-gradient(135deg, #00ffff, #ff6f61);
      color: #1e1e1e;
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .mode-toggle:hover {
      background: linear-gradient(135deg, #ff6f61, #00ffff);
      transform: scale(1.1);
    }

    .settings-header {
      background: #0d6efd;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .settings-card {
      padding: 20px;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    .header1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 15px;
      position: sticky;
      top: 0;
      background: linear-gradient(90deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      z-index: 10;
      /* margin-left: 50px; */
      margin-right: 460px;
      border-radius: 50px;
      width: 550px;
    }

    .header1 i {
      font-size: 1.5em;
      color: #1e88e5;
      cursor: pointer;
    }

    #arrow {
      margin-top: 20px;
      padding-left: 20px;
    }

    #mode-toggle {
      margin-top: 20px;
      margin-right: 20px;
    }

    .username-edit-section,
    .bio-section {
      position: relative;
      display: inline-block;
      margin: 10px 0;
    }

    .edit-icon {
      margin-left: 10px;
      cursor: pointer;
      color: #888;
      transition: color 0.3s;
    }

    .edit-icon:hover {
      color: #000;
    }

    .edit-hover {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #f1f1f1;
      color: #333;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 5px;
      white-space: nowrap;
      box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.15);
      z-index: 10;
    }
    /* Style the container */
.mt-3 {
    margin-top: 1.5rem;
}

/* Style the label */
label {
    font-size: 1.1rem;
    font-weight: 600;
    color: #333;
    margin-bottom: 0.5rem;
    display: block;
}

/* Style the select dropdown */
.form-select {
    width: 100%;
    padding: 0.5rem 1rem;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 8px;
    background-color: #f9f9f9;
    transition: border-color 0.3s ease;
}

.form-select:focus {
    border-color: #007bff;
    outline: none;
    background-color: #fff;
}

/* Style the session details box */
#sessionDetails {
    margin-top: 1rem;
    padding: 1rem;
    border: 1px solid #ddd;
    border-radius: 8px;
    background-color: #f1f1f1;
    min-height: 50px;
    font-size: 1rem;
    color: #444;
    transition: background-color 0.3s ease;
}

/* Optional: Add hover effect on the dropdown options (if using custom dropdown) */
option:hover {
    background-color: #e9ecef;
}

  </style>
</head>

<body>
  <div class="header1">
    <i class="fas fa-arrow-left" id="arrow" onclick="window.history.back()" title="Back"></i>
    <h3>settings</h3>
    <button class="mode-toggle" id="mode-toggle">🌙</button>
  </div>
  <div class="container py-5">


    <!-- Reusable Collapsible Section Template -->
    <div class="settings-section">
      <div class="settings-header" data-bs-toggle="collapse" data-bs-target="#accountSettings">
        Account Settings
      </div>
      <div id="accountSettings" class="collapse">
        <div class="settings-card">
          <!-- Account Settings Form Inputs -->
          <form>
            <div class="editable-section">
              <h2 id="display-username">{{ username }}</h2>
              <i class="fas fa-edit edit-icon" onclick="editUsername()"></i>

              <form id="username-form" method="POST" action="{% url 'edit_profile' %}" style="display: none;">
                {% csrf_token %}
                <input type="text" name="new_username" value="{{ username }}" required>
                <button type="submit">Save</button>
                <button type="button" onclick="cancelEdit('username')">Cancel</button>
              </form>
            </div>
            <div class="mb-3"><label>Email</label><input type="email" class="form-control"></div>
            <div class="mb-3"><label>Phone Number</label><input type="tel" class="form-control"></div>
            <div class="mb-3"><label>Password</label><input type="password" class="form-control"></div>
            <div class="mb-3"><label>Date of Birth</label><input type="date" class="form-control"></div>
            <div class="mb-3"><label>Gender / Pronouns</label><input type="text" class="form-control"></div>
            <div class="mb-3"><label>Profile Picture</label><input type="file" class="form-control"></div>
            <div class="mb-3"><label>Bio / About Me</label><textarea class="form-control" rows="3"></textarea></div>
          </form>
        </div>
      </div>
    </div>

    <!-- Repeat Below Pattern for Each Section -->
    <div class="settings-section">
      <div class="settings-header" data-bs-toggle="collapse" data-bs-target="#privacySettings">
        Privacy Settings
      </div>
      <div id="privacySettings" class="collapse">
        <div class="settings-card">
          <!-- Privacy Settings Form -->
          <form method="POST" action="{% url 'update_privacy_settings' %}">
            {% csrf_token %}
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="privateAccount" name="private_account" {% if user.private_account %}checked{% endif %}>


              <label class="form-check-label" for="privateAccount">Private Account</label>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Save</button>
          </form>

          <!-- Additional Settings (Optional: You can later implement saving for these) -->
          <div class="mt-3">
            <label>Who can follow me:</label>
            <select class="form-select" name="follow_permission">
              <option>Everyone</option>
              <option>Friends Only</option>
            </select>
          </div>

          <div class="mt-3">
            <label>Who can comment/message:</label>
            <select class="form-select" name="comment_permission">
              <option>Everyone</option>
              <option>Followers</option>
              <option>Friends Only</option>
            </select>
          </div>

          <div class="mt-3">
            <label>Blocked Accounts</label>
            <input type="text" class="form-control" name="blocked_accounts">
          </div>

          <form method="POST" action="{% url 'update_last_seen' %}">
            {% csrf_token %}
            <div class="form-check form-switch mt-3">
              <input class="form-check-input" type="checkbox" id="activityStatus" name="last_seen" value="show" {% if user.last_seen_visible %}checked{% endif %}>

              <label class="form-check-label" for="activityStatus">Show my online status</label>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Save</button>
          </form>




          <div class="mt-3">
            <label>Story Privacy:</label>
            <select class="form-select" name="story_privacy">
              <option>Everyone</option>
              <option>Friends Only</option>
              <option>Custom</option>
            </select>
          </div>

          <div class="mt-3">
            <label>Login History</label>
            <select class="form-select" name="session_history" id="sessionSelect" onchange="showSessionDetails()">
              <option value="">Select a Session</option>
              {% for session in history %}
              <option value="{{ session.login_time }}">{{ session.login_time }} - IP: {{ session.ip_address }}</option>
              {% endfor %}
            </select>
          </div>

          <div id="sessionDetails" class="mt-3">
            <!-- Session details will appear here -->
          </div>
        </div>
      </div>
    </div>


    <!-- Add collapsible sections for: Notifications, Appearance, Language & Region, Connected Accounts, Data & Security, Account Actions, Support & Help, Advanced Features -->

    <!-- Example: Notifications -->
    <div class="settings-section">
      <div class="settings-header" data-bs-toggle="collapse" data-bs-target="#notifications">
        Notifications
      </div>
      <div id="notifications" class="collapse">
        <div class="settings-card">
          <div class="form-check"><input class="form-check-input" type="checkbox" id="push"><label
              class="form-check-label" for="push">Push Notifications</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="email"><label
              class="form-check-label" for="email">Email Notifications</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="sms"><label
              class="form-check-label" for="sms">SMS Alerts</label></div>
          <hr>
          <label>Customize:</label>
          <div class="form-check"><input class="form-check-input" type="checkbox" checked> Likes</div>
          <div class="form-check"><input class="form-check-input" type="checkbox" checked> Comments</div>
          <div class="form-check"><input class="form-check-input" type="checkbox" checked> Follows</div>
          <div class="form-check"><input class="form-check-input" type="checkbox" checked> Mentions</div>
          <div class="form-check"><input class="form-check-input" type="checkbox" checked> Stories</div>
          <div class="form-check"><input class="form-check-input" type="checkbox" checked> Messages</div>
        </div>
      </div>
    </div>

    <!-- Repeat similar collapsible pattern for other sections... -->
  </div>
  <script>
    /* fetch('/update_last_seen/', {
       method: 'POST',
       headers: {
         'Content-Type': 'application/json',
         'X-CSRFToken': '{{ csrf_token }}'
       },
       body: JSON.stringify({
         'last_seen': 'show'  // or 'hide'
       })
     })
       .then(response => response.json())
       .then(data => console.log(data));*/

    const modeToggle = document.getElementById('mode-toggle');
    modeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      modeToggle.textContent = document.body.classList.contains('light-mode') ? '🌞' : '🌙';
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const csrftoken = document.querySelector('[name=csrf-token]').content;

    function updateLastSeen(isOnline) {
      fetch("{% url 'update_last_seen' %}", {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': csrftoken
        },
        body: JSON.stringify({ is_online: isOnline })
      })
        .then(response => response.json())
        .then(data => console.log(data))
        .catch(error => console.error('Error:', error));
    }

    // Update every 30 seconds
    setInterval(function () {
      updateLastSeen(true);
    }, 30000);

    // Optional: Update to offline when tab closes
    window.addEventListener('beforeunload', function () {
      navigator.sendBeacon("{% url 'update_last_seen' %}", JSON.stringify({ is_online: false }));
    });
    function showSessionDetails() {
      var select = document.getElementById('sessionSelect');
      var selectedOption = select.options[select.selectedIndex].text;
      document.getElementById('sessionDetails').innerText = 'Selected Session: ' + selectedOption;
    }
  </script>

</body>

</html>
