<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Updated CSS with neon effects and animations */
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --neon-green: #00ff00;
            --neon-purple: #9d00ff;
            --neon-orange: #ff5e00;
            --primary-color: #ff6f61;
            --dark-color: #1e1e1e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0px 330px 0px 330px;
            padding: 0;
            background: white;
            color: #f4f4f4;
            transition: background 0.5s ease, color 0.5s ease;
            position: relative;
            overflow-x: hidden;
            border: 1px solid black;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(255, 0, 255, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.light-mode::before {
            background: radial-gradient(circle at center, rgba(0, 255, 255, 0.05) 0%, transparent 70%);
        }

        body.neon-active::before {
            opacity: 1;
        }

        body.light-mode {
            background: linear-gradient(135deg, #f4f4f4, #e0e0e0);
            color: #1e1e1e;
        }

        .notification-profile-pic { 
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
            border: 1px solid transparent;
            transition: border 0.3s ease, transform 0.3s ease;
        }

        .notification-profile-pic:hover {
            transform: scale(1.1);
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        h1 {
            text-align: left;
            padding: 20px;
            font-size: 1.8rem;
            color: var(--primary-color);
            animation: fadeIn 1s ease-in-out;
            text-shadow: 0 0 5px rgba(255, 111, 97, 0.5);
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 10px;
            left: 20px;
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-color), transparent);
            border-radius: 3px;
        }

        #notifications-container {
            margin: 0 auto;
            max-width: 600px;
            padding: 10px 20px;
        }

        .notification {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #2c2c2c, #444);
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            animation: slideIn 0.5s ease-in-out;
            transition: transform 0.3s, box-shadow 0.3s, border 0.3s;
            border: 1px solid transparent;
            overflow: hidden;
        }

        .notification::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 12px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue), var(--neon-green), var(--neon-purple));
            background-size: 400% 400%;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
            animation: gradientBorder 4s ease infinite;
        }

        .notification:hover::after {
            opacity: 0.7;
        }

        body.light-mode .notification {
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            color: #1e1e1e;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .notification:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .notification.deleting {
            animation: fadeOutShrink 0.5s forwards;
        }

        .notification.restoring {
            animation: fadeInExpand 0.5s forwards;
        }

        .profile-pic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
            animation: popIn 0.5s ease-in-out;
            transition: all 0.3s ease;
        }

        .profile-pic:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .notification-content {
            flex-grow: 1;
        }

        .notification-content p {
            margin: 0;
            color: #f4f4f4;
            transition: color 0.3s ease;
        }

        body.light-mode .notification-content p {
            color: #1e1e1e;
        }

        .username {
            font-weight: bold;
            color: var(--primary-color);
            text-shadow: 0 0 5px rgba(255, 111, 97, 0.3);
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .username:hover {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .timestamp {
            display: block;
            font-size: 0.85rem;
            color: #888;
            margin-top: 5px;
            transition: color 0.3s ease;
        }

        .timestamp:hover {
            color: var(--neon-green);
        }

        .remove-notification {
            position: absolute;
            top: 10px;
            right: 15px;
            background-color: transparent;
            color: #d81b60;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .remove-notification:hover {
            color: #ff5a5f;
            background-color: rgba(255, 90, 95, 0.2);
            transform: rotate(90deg) scale(1.2);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 550px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0;
            background-color: #2c2c2c;
            border-top: 1px solid #444;
            z-index: 1000;
            border-radius: 25px 25px 0 0;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.5s ease;
        }

        body.light-mode .bottom-nav {
            background-color: #ffffff;
            border-top: 1px solid #e0e0e0;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.1);
        }

        .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 550px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0;
      background-color: white;
      border-top: 1px solid black;
      z-index: 1000;
      border-radius: 50px;
    }
    
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--dark-color);
      text-decoration: none;
      font-size: 0.8rem;
    }
    
    .nav-item i {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }
    
    .nav-item.active {
      /* color: var(--primary-color); */
      color: red;
    }

        /* Undo Container */
        .undo-container {
            display: none;
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff6f61, #d81b60);
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(216, 27, 96, 0.4);
            z-index: 1000;
            animation: fadeInUp 0.5s ease-in-out;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .undo-container::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 32px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-orange), var(--neon-pink));
            background-size: 200% 200%;
            z-index: -1;
            opacity: 0.7;
            animation: gradientBorder 3s ease infinite;
        }

        .undo-button {
            background-color: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            margin-left: 15px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .undo-button:hover {
            background-color: #fff;
            color: #ff6f61;
            transform: scale(1.05);
            box-shadow: 0 0 10px #fff;
        }

        /* Dark/Light Mode Toggle */
        .mode-toggle {
            position: fixed;
            top: 20px;
            right: 370px;
            background: linear-gradient(135deg, #ff6f61, #d81b60);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.5s ease;
            box-shadow: 0 4px 15px rgba(255, 111, 97, 0.4);
            z-index: 1000;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
        }

        .mode-toggle:hover {
            background: linear-gradient(135deg, #d81b60, #ff6f61);
            transform: scale(1.1) rotate(30deg);
            box-shadow: 0 0 20px var(--neon-pink);
        }

        .mode-toggle::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 32px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue), var(--neon-pink));
            background-size: 200% 200%;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
            animation: gradientBorder 3s ease infinite;
        }

        .mode-toggle:hover::after {
            opacity: 0.7;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateX(-30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeInUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeOutShrink {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.8); }
        }

        @keyframes fadeInExpand {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 5px var(--neon-pink); }
            50% { box-shadow: 0 0 20px var(--neon-blue); }
            100% { box-shadow: 0 0 5px var(--neon-pink); }
        }

        .notification.unfollow {
            background: linear-gradient(135deg, #2c2c2c, #444);
            border-left: 4px solid #ff4d4d;
        }

        body.light-mode .notification.unfollow {
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            border-left: 4px solid #ff4d4d;
        }

        .unfollow .username {
            color: #ff4d4d;
            text-shadow: 0 0 5px rgba(255, 77, 77, 0.5);
        }

        .notification.unfollow::before {
            content: "❌";
            margin-right: 10px;
            font-size: 1.2em;
            animation: pulse 1.5s infinite;
        }

        /* Neon glow effect */
        .neon-text {
            animation: flicker 1.5s infinite alternate;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 15px var(--neon-pink),
                    0 0 20px var(--neon-pink),
                    0 0 25px var(--neon-pink),
                    0 0 30px var(--neon-pink),
                    0 0 35px var(--neon-pink);
            }
            20%, 24%, 55% {        
                text-shadow: none;
            }
        }

        /* Responsive adjustments */
        @media (max-width: 1200px) {
            body {
                margin: 0px 200px 0px 200px;
            }
            .mode-toggle {
                right: 220px;
            }
        }

        @media (max-width: 992px) {
            body {
                margin: 0px 100px 0px 100px;
            }
            .mode-toggle {
                right: 120px;
            }
        }

        @media (max-width: 768px) {
            body {
                margin: 0px 50px 0px 50px;
            }
            .mode-toggle {
                right: 70px;
            }
        }

        @media (max-width: 576px) {
            body {
                margin: 0px 20px 0px 20px;
            }
            .mode-toggle {
                right: 30px;
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            h1 {
                font-size: 1.5rem;
                padding: 15px 20px;
            }
            .notification {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <button class="mode-toggle" id="mode-toggle">🌙</button>
    <h1 class="neon-text">Notifications</h1>

    <div id="notifications-container">
        {% for notification in notifications %}
        <div class="notification {% if notification.notification_type == 'unfollow' %}unfollow{% endif %}" data-id="{{ notification.id }}">
            <img src="{{ notification.user_profile_image }}" 
            onerror="this.onerror=null; this.src='/media/default-profile.png';"
            alt="{{ notification.username }}" 
            class="notification-profile-pic">   
            <div class="notification-content">
                <p>
                    <span class="username">{{ notification.username }}</span>
                    {{ notification.message }}
                </p>
                <small class="timestamp">{{ notification.timestamp }}</small>
            </div>
            <button class="remove-notification" title="Remove Notification">✖</button>
        </div>
        {% empty %}
        <p>No notifications found.</p>
        {% endfor %}
    </div>

    <div class="undo-container" id="undo-container">
        Notification removed.
        <button class="undo-button" id="undo-button">Undo</button>
    </div>

    <nav class="bottom-nav">
        <a href="{% url 'loginsuccess' %}" class="nav-item ">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="{% url 'search' %}" class="nav-item">
            <i class="fas fa-search"></i>
            <span>Search</span>
        </a>
        <a href="{% url 'notifications' %}" class="nav-item active">
            <i class="fas fa-heart"></i>
            <span>Activity</span>
        </a>
        <a href="{% url 'profile' %}" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        let lastDeletedNotification = null;
        let deleteTimeout = null;
        let neonInterval = null;

        // Activate neon effects randomly
        function activateRandomNeon() {
            const notifications = document.querySelectorAll('.notification');
            if (notifications.length > 0) {
                const randomIndex = Math.floor(Math.random() * notifications.length);
                notifications[randomIndex].classList.add('neon-active');
                
                setTimeout(() => {
                    notifications[randomIndex].classList.remove('neon-active');
                }, 2000);
            }
        }

        // Start neon effect interval
        function startNeonEffects() {
            if (neonInterval) clearInterval(neonInterval);
            neonInterval = setInterval(activateRandomNeon, 5000);
            document.body.classList.add('neon-active');
        }

        // Stop neon effects
        function stopNeonEffects() {
            if (neonInterval) clearInterval(neonInterval);
            document.body.classList.remove('neon-active');
        }

        $(document).ready(function() {
            startNeonEffects();
            
            // Notification deletion with animation
            $(document).on('click', '.remove-notification', function() {
                const notificationElement = $(this).closest('.notification');
                const notificationId = notificationElement.data('id');

                // Save the deleted notification data for undo
                lastDeletedNotification = {
                    id: notificationId,
                    element: notificationElement,
                    html: notificationElement.html()
                };

                // Add deleting class for animation
                notificationElement.addClass('deleting');

                // Show the undo container with animation
                $('#undo-container').css('display', 'flex').hide().fadeIn();

                // Send AJAX request to delete the notification (soft delete)
                $.ajax({
                    url: '/delete-notification/',
                    method: 'POST',
                    data: {
                        id: notificationId,
                        csrfmiddlewaretoken: '{{ csrf_token }}'
                    },
                    success: function() {
                        console.log('Notification soft deleted.');
                    },
                    error: function(error) {
                        console.error('Error deleting notification:', error);
                    }
                });

                // After animation completes, hide the element
                setTimeout(() => {
                    notificationElement.hide();
                }, 500);

                // Permanent delete after 5 seconds if no undo
                deleteTimeout = setTimeout(function() {
                    if (lastDeletedNotification) {
                        $.ajax({
                            url: '/permanent-delete-notification/',
                            method: 'POST',
                            data: {
                                id: notificationId,
                                csrfmiddlewaretoken: '{{ csrf_token }}'
                            },
                            success: function() {
                                console.log('Notification permanently deleted.');
                                lastDeletedNotification.element.remove();
                            },
                            error: function(error) {
                                console.error('Error permanently deleting notification:', error);
                            }
                        });

                        $('#undo-container').fadeOut();
                        lastDeletedNotification = null;
                    }
                }, 5000);
            });

            // Undo deletion with animation
            $('#undo-button').on('click', function() {
                if (lastDeletedNotification) {
                    const { id, element, html } = lastDeletedNotification;

                    clearTimeout(deleteTimeout);

                    // Restore the element's content and show it
                    element.html(html).show().removeClass('deleting').addClass('restoring');

                    // After restore animation completes
                    setTimeout(() => {
                        element.removeClass('restoring');
                    }, 500);

                    $.ajax({
                        url: '/restore-notification/',
                        method: 'POST',
                        data: {
                            id: id,
                            csrfmiddlewaretoken: '{{ csrf_token }}'
                        },
                        success: function() {
                            console.log('Notification restored.');
                        },
                        error: function(error) {
                            console.error('Error restoring notification:', error);
                        }
                    });

                    $('#undo-container').fadeOut();
                    lastDeletedNotification = null;
                }
            });

            // Dark/Light Mode Toggle with enhanced effects
            const modeToggle = document.getElementById('mode-toggle');
            const body = document.body;

            modeToggle.addEventListener('click', () => {
                body.classList.toggle('light-mode');
                
                if (body.classList.contains('light-mode')) {
                    modeToggle.textContent = '🌞';
                    stopNeonEffects();
                } else {
                    modeToggle.textContent = '🌙';
                    startNeonEffects();
                }
                
                // Add pulse effect on toggle
                modeToggle.classList.add('pulse');
                setTimeout(() => {
                    modeToggle.classList.remove('pulse');
                }, 500);
            });

            // Add hover effect to notifications
            $('.notification').hover(
                function() {
                    $(this).css('transform', 'translateY(-5px) scale(1.02)');
                },
                function() {
                    $(this).css('transform', '');
                }
            );
        });

        // Add animation to page load
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
